name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build --if-present    # run this command only if that build is there 
#--------------- creating an artifact , giving a name and storing it at a particular location 

      - name: uploading artifacts 
        uses: actions/upload-artifact@v4
        with: 
          name: dist-files 
          path: |
            dist
            package.json 

# ---------------------------------------------- 


  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # downloading the artifacts created in build job 
      - name: downloading artifacts 
        uses: actions/download-artifacts@v4 
        with: 
          name: dist-files   # used the specific name to download 
      
      - name: output the content of artifact 
        run: ls  
      
      - name: Deploy
        run: echo "Deploying..."
